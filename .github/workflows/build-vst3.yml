name: Build AURAVOX Pro VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Windows plugin
        run: cmake --build build --config Release --target AURAVOXPro_VST3 --parallel 2
      - name: Stage plugin
        shell: pwsh
        run: |
          $src = "build/AURAVOXPro_artefacts/Release/VST3/AURAVOX Pro.vst3"
          if (!(Test-Path $src -PathType Container)) { throw "VST3 bundle missing" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $src -Destination dist -Recurse -Force
      - name: Upload installable Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: AURAVOX-Pro-Windows-x64-VST3
          path: dist/
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build macOS plugin
        run: cmake --build build --config Release --target AURAVOXPro_VST3 --parallel 2
      - name: Stage plugin
        run: |
          mkdir -p dist
          cp -R "build/AURAVOXPro_artefacts/Release/VST3/AURAVOX Pro.vst3" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: AURAVOX-Pro-macOS-universal-unsigned-VST3
          path: dist/
          if-no-files-found: error
